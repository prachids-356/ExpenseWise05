spring.application.name=ExpenseWise
server.port=${SERVER_PORT:8080}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/expensewise}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:expensewise_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:ChangeMeToStrongPassword123!}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Flyway
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

# Security (Matches JwtService @Value("${app.jwt.secret}") & Base64 decoder)
app.jwt.secret=${JWT_SECRET:c2VjdXJlLWV4cGVuc2V3aXNlLXByb2R1Y3Rpb24tand0LXNlY3JldC1rZXktMjU2LWJpdHM=}
app.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:60}
app.cors.allowed-origins=${ALLOWED_ORIGINS:http://localhost,http://localhost:80,http://localhost:5500,http://127.0.0.1:5500,http://localhost:8080}