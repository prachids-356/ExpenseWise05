name: ExpenseWise CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Build and run backend tests
        working-directory: ExpenseWise/backend
        run: mvn --batch-mode clean verify

      - name: Verify Docker Hub credentials
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -z "$DOCKERHUB_USERNAME" ] || [ -z "$DOCKERHUB_TOKEN" ]; then
            echo "::error::DOCKERHUB_USERNAME or DOCKERHUB_TOKEN is missing. Add both as repository Actions secrets."
            exit 1
          fi

      - name: Set up Docker Buildx
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push backend image
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: ExpenseWise/backend
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/expensewise-backend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/expensewise-backend:${{ github.sha }}

      - name: Build and push frontend image
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: ExpenseWise/frontend
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/expensewise-frontend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/expensewise-frontend:${{ github.sha }}
